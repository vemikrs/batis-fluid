---
name: Release

"on":
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.0.3). Leave empty for automatic patch bump.'
        required: false
        type: string
      skip_maven_central:
        description: 'Skip Maven Central publishing (GitHub release only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Build Release Artifacts
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_version: ${{ steps.version.outputs.publish_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: version
        run: |
          # --- Helper: compare semver (returns 0 if $1 > $2) ---
          version_gt() {
            local IFS='.'
            local -a v1=($1) v2=($2)
            for i in 0 1 2; do
              if (( v1[i] > v2[i] )); then return 0; fi
              if (( v1[i] < v2[i] )); then return 1; fi
            done
            return 1  # equal → not greater
          }

          # --- Fetch latest stable tag (exclude prerelease like -test, -rc, etc.) ---
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LATEST_VERSION="${LATEST_TAG#v}"
          echo "Latest stable tag: ${LATEST_TAG:-<none>} (version: ${LATEST_VERSION:-<none>})"

          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            # === Triggered by tag push (existing behavior) ===
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            PUBLISH_VERSION="${TAG_VERSION#v}"
            echo "Tag push trigger: ${TAG_VERSION}"

          elif [ -z "$INPUT_VERSION" ]; then
            # === No version specified: automatic patch bump ===
            if [ -z "$LATEST_VERSION" ]; then
              echo "❌ No existing tags found. Please specify a version for the initial release."
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            TAG_VERSION="v${NEW_VERSION}"
            PUBLISH_VERSION="${NEW_VERSION}"

            echo "🔄 Auto patch bump: ${LATEST_TAG} → ${TAG_VERSION}"

            # Update build.gradle.kts files
            sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" \
              lib/build.gradle.kts spring/build.gradle.kts

            # Commit & push
            git add lib/build.gradle.kts spring/build.gradle.kts
            git commit -m "chore(release): bump version to ${NEW_VERSION} [skip ci]"
            git push origin main

            # Create & push tag
            git tag "${TAG_VERSION}"
            git push origin "${TAG_VERSION}"

          else
            # === Version specified ===
            TAG_VERSION="${INPUT_VERSION}"
            # Ensure 'v' prefix
            [[ "$TAG_VERSION" != v* ]] && TAG_VERSION="v${TAG_VERSION}"
            PUBLISH_VERSION="${TAG_VERSION#v}"

            # Validate semver format
            if ! [[ "$TAG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Invalid semver format: ${TAG_VERSION}"
              echo "Expected format: vX.Y.Z (e.g., v0.1.0)"
              exit 1
            fi

            # Check if tag already exists on remote
            if git ls-remote --tags origin "refs/tags/${TAG_VERSION}" | grep -q "${TAG_VERSION}"; then
              echo "✅ Tag ${TAG_VERSION} already exists on remote. Using existing tag."
            else
              # Tag doesn't exist — validate it's an increment over latest
              if [ -z "$LATEST_VERSION" ]; then
                echo "No existing tags. Creating initial tag: ${TAG_VERSION}"
              else
                if ! version_gt "${PUBLISH_VERSION}" "${LATEST_VERSION}"; then
                  echo "❌ Version ${PUBLISH_VERSION} is not greater than latest ${LATEST_VERSION}"
                  echo "New version must be an increment (MAJOR, MINOR, or PATCH) over the latest release."
                  exit 1
                fi
                echo "✅ Version ${PUBLISH_VERSION} > ${LATEST_VERSION} — validation passed"
              fi

              echo "🏷️  Creating new tag: ${TAG_VERSION}"

              # Update build.gradle.kts files
              sed -i "s/^version = \".*\"/version = \"${PUBLISH_VERSION}\"/" \
                lib/build.gradle.kts spring/build.gradle.kts

              # Commit & push
              git add lib/build.gradle.kts spring/build.gradle.kts
              if git diff --cached --quiet; then
                echo "No version changes needed in build.gradle.kts"
              else
                git commit -m "chore(release): bump version to ${PUBLISH_VERSION} [skip ci]"
                git push origin main
              fi

              # Create & push tag
              git tag "${TAG_VERSION}"
              git push origin "${TAG_VERSION}"
            fi
          fi

          echo "version=${TAG_VERSION}" >> $GITHUB_OUTPUT
          echo "publish_version=${PUBLISH_VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Building version: ${TAG_VERSION} (publish version: ${PUBLISH_VERSION})"

      - name: Build artifacts
        run: |
          export PROJECT_VERSION="${{ steps.version.outputs.publish_version }}"
          ./gradlew clean build publishToMavenLocal -Pversion="$PROJECT_VERSION" --no-daemon

      - name: List built artifacts
        run: |
          echo "Built artifacts:"
          find lib/build/libs -name "*.jar" -ls
          find spring/build/libs -name "*.jar" -ls
          echo ""
          echo "Maven repository artifacts:"
          find ~/.m2/repository/jp/vemi -name "*.jar" -ls 2>/dev/null || echo "No local Maven artifacts found"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            lib/build/libs/*.jar
            spring/build/libs/*.jar
            ~/.m2/repository/jp/vemi/**/*
          retention-days: 5

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Create GitHub Release

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          files: |
            artifacts/lib/build/libs/*.jar
            artifacts/spring/build/libs/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## 📦 Artifacts

            - **Core**: `batis-fluid-core-${{ needs.build.outputs.publish_version }}.jar`
            - **Core Sources**: `batis-fluid-core-${{ needs.build.outputs.publish_version }}-sources.jar`
            - **Core Javadoc**: `batis-fluid-core-${{ needs.build.outputs.publish_version }}-javadoc.jar`
            - **Spring**: `batis-fluid-spring-${{ needs.build.outputs.publish_version }}.jar`
            - **Spring Sources**: `batis-fluid-spring-${{ needs.build.outputs.publish_version }}-sources.jar`
            - **Spring Javadoc**: `batis-fluid-spring-${{ needs.build.outputs.publish_version }}-javadoc.jar`

            ## 🚀 Maven Central

            This release is automatically published to Maven Central via Central Portal.
            Status: https://central.sonatype.com/

            **Gradle:**
            ```kotlin
            implementation("jp.vemi:batis-fluid-core:${{ needs.build.outputs.publish_version }}")
            implementation("jp.vemi:batis-fluid-spring:${{ needs.build.outputs.publish_version }}")
            ```

            **Maven:**
            ```xml
            <dependency>
              <groupId>jp.vemi</groupId>
              <artifactId>batis-fluid-core</artifactId>
              <version>${{ needs.build.outputs.publish_version }}</version>
            </dependency>
            <dependency>
              <groupId>jp.vemi</groupId>
              <artifactId>batis-fluid-spring</artifactId>
              <version>${{ needs.build.outputs.publish_version }}</version>
            </dependency>
            ```

  maven-central-publish:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Publish to Maven Central via Central Portal
    if: ${{ !github.event.inputs.skip_maven_central }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Publish to Maven Central via Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets['SIGNING_KEY'] }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets['SIGNING_KEY_PASSWORD'] }}
        run: |
          # Check for publishing credentials (Central Portal required)
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || [ -z "$ORG_GRADLE_PROJECT_mavenCentralPassword" ]; then
            echo "🚨 Missing Central Portal publishing credentials"
            echo "Please set the following GitHub Secrets:"
            echo "  • MAVEN_CENTRAL_USERNAME (Central Portal token name/ID)"
            echo "  • MAVEN_CENTRAL_PASSWORD (Central Portal token secret)"
            echo ""
            echo "📚 Setup guide: https://central.sonatype.com/"
            echo ""
            echo "📋 Manual upload instructions (fallback):"
            echo "1. Visit: https://central.sonatype.com/"
            echo "2. Sign in with your Central Portal account"
            echo "3. Upload artifacts from the GitHub release"
            echo "4. Follow the Central Portal publishing workflow"
            exit 1
          fi

          echo "📦 Publishing to Maven Central via Central Portal..."
          echo "Using Central Portal credentials"

          export PROJECT_VERSION="${{ needs.build.outputs.publish_version }}"
          ./gradlew validateCredentials -Pversion="$PROJECT_VERSION" --no-daemon
          ./gradlew publishAllPublicationsToMavenCentralRepository -Pversion="$PROJECT_VERSION" --no-daemon --stacktrace

      - name: Publishing Success
        if: success()
        run: |
          echo "✅ Successfully published to Maven Central via Central Portal!"
          echo "🔍 Check deployment status: https://central.sonatype.com/"
          echo "⏱️  Artifacts will appear on Maven Central once processing completes"
